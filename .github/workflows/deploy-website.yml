name: Deploy website

# Deploys the static project website (website/) to the Oracle Cloud server
# over SSH, the same way the local scripts/deploy-website.sh does:
#   rsync website/ -> oracle-cloud:/opt/apps/osmand-euc/website/
# Served by nginx at https://osmand-euc.a42r.com/
#
# Triggers:
#   - push to main that touches website/, scripts/, or this workflow
#   - manual dispatch
#
# Required repository secrets:
#   ORACLE_DEPLOY_KEY    private SSH key whose public half is authorised on
#                        ubuntu@oracle-cloud (authorised_keys)
#   ORACLE_HOST_KEY      known_hosts entry/entries for the server
#                        (ssh-keyscan -H 161.33.93.37)

on:
  push:
    branches:
      - main
    paths:
      - "website/**"
      - "scripts/deploy-website.sh"
      - ".github/workflows/deploy-website.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-website
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up SSH
        env:
          DEPLOY_KEY: ${{ secrets.ORACLE_DEPLOY_KEY }}
          HOST_KEY: ${{ secrets.ORACLE_HOST_KEY }}
        run: |
          missing=""
          if [ -z "$DEPLOY_KEY" ]; then missing="$missing ORACLE_DEPLOY_KEY"; fi
          if [ -z "$HOST_KEY" ]; then missing="$missing ORACLE_HOST_KEY"; fi
          if [ -n "$missing" ]; then
            echo "::error::Missing GitHub Actions secrets:$missing"
            exit 1
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519_deploy
          chmod 600 ~/.ssh/id_ed25519_deploy
          printf '%s\n' "$HOST_KEY" > ~/.ssh/known_hosts
          {
            printf 'Host oracle-cloud\n'
            printf '    Hostname 161.33.93.37\n'
            printf '    User ubuntu\n    Port 22\n'
            printf '    IdentityFile ~/.ssh/id_ed25519_deploy\n'
            printf '    IdentitiesOnly yes\n'
          } > ~/.ssh/config

      - name: Deploy website
        run: |
          rsync -az --delete website/ "oracle-cloud:/opt/apps/osmand-euc/website/"

      - name: Verify deployment
        run: |
          ssh oracle-cloud "ls -la /opt/apps/osmand-euc/website/index.html"
          curl -fsS --resolve osmand-euc.a42r.com:443:161.33.93.37 \
            https://osmand-euc.a42r.com/ -o /dev/null
          echo "Website is live at https://osmand-euc.a42r.com/"
