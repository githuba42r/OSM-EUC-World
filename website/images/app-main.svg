<svg xmlns="http://www.w3.org/2000/svg" width="360" height="780" viewBox="0 0 360 780">
  <!-- Interface mockup: main phone screen, faithful to res/layout/activity_main.xml
       (theme background #1A1A1A, cards #2D2D2D r=8, green HUD battery, white voltage) -->
  <defs>
    <clipPath id="phone"><rect x="0" y="0" width="360" height="780" rx="0"/></clipPath>
  </defs>
  <g clip-path="url(#phone)">

  <!-- Root background -->
  <rect width="360" height="780" fill="#1A1A1A"/>

  <!-- Action bar (Theme.MaterialComponents DayNight.DarkActionBar with colorPrimaryDark) -->
  <rect width="360" height="56" fill="#1976D2"/>
  <text x="16" y="36" font-family="sans-serif" font-size="17" font-weight="600" fill="#FFFFFF">EUC OsmAnd Plugin</text>
  <circle cx="336" cy="28" r="3" fill="none" stroke="#FFFFFF" stroke-width="2"/>
  <line x1="336" y1="31" x2="336" y2="35" stroke="#FFFFFF" stroke-width="2"/>
  <line x1="336" y1="28" x2="342" y2="28" stroke="#FFFFFF" stroke-width="2"/>

  <!-- status bar -->
  <rect width="360" height="24" fill="#1976D2"/>
  <text x="344" y="17" font-family="sans-serif" font-size="10" fill="#FFFFFF" text-anchor="end">100%</text>
  <rect x="318" y="8" width="18" height="9" rx="2" fill="#FFFFFF" opacity="0.9"/>

  <!-- Scroll padding offset -->
  <g transform="translate(0,0)">

  <!-- cardBattery: wheel name + connection, HUD battery %, voltage -->
  <rect x="8" y="80" width="344" height="196" rx="8" fill="#2D2D2D"/>
  <text x="24" y="112" font-family="sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">InMotion V12</text>
  <circle cx="266" cy="106" r="4" fill="#4CAF50"/>
  <text x="276" y="111" font-family="sans-serif" font-size="19" fill="#B0B0B0">Connected</text>
  <text x="180" y="204" font-family="sans-serif" font-size="86" font-weight="800" fill="#4CAF50" text-anchor="middle">85</text>
  <text x="180" y="256" font-family="sans-serif" font-size="44" font-weight="600" fill="#FFFFFF" text-anchor="middle">84.2 V</text>

  <!-- Metrics grid card: Speed / Temperature / Power / Load -->
  <rect x="8" y="284" width="344" height="96" rx="8" fill="#2D2D2D"/>
  <g font-family="sans-serif" text-anchor="middle">
    <text x="51"  y="312" font-size="15" fill="#B0B0B0">Speed</text>
    <text x="51"  y="348" font-size="26" fill="#FFFFFF">28.4</text>
    <text x="51"  y="368" font-size="12" fill="#B0B0B0">km/h</text>
    <text x="133" y="312" font-size="15" fill="#B0B0B0">Temperature</text>
    <text x="133" y="348" font-size="26" fill="#FFFFFF">38&#176;</text>
    <text x="133" y="368" font-size="12" fill="#B0B0B0">C</text>
    <text x="215" y="312" font-size="15" fill="#B0B0B0">Power</text>
    <text x="215" y="348" font-size="26" fill="#FFFFFF">1250</text>
    <text x="215" y="368" font-size="12" fill="#B0B0B0">W</text>
    <text x="309" y="312" font-size="15" fill="#B0B0B0">Load</text>
    <text x="309" y="348" font-size="26" fill="#FFFFFF">62</text>
    <text x="309" y="368" font-size="12" fill="#B0B0B0">%</text>
  </g>

  <!-- Distance info card: Wheel Trip / Total Distance -->
  <rect x="8" y="388" width="344" height="86" rx="8" fill="#2D2D2D"/>
  <g font-family="sans-serif" text-anchor="middle">
    <text x="96"  y="414" font-size="15" fill="#B0B0B0">Wheel Trip</text>
    <text x="96"  y="452" font-size="26" fill="#FFFFFF">15.2 km</text>
    <text x="264" y="414" font-size="15" fill="#B0B0B0">Total Distance</text>
    <text x="264" y="452" font-size="26" fill="#FFFFFF">1450.3 km</text>
  </g>

  <!-- App trip meters card: header row (label, spinner, Reset, Clear All) + Trip A/B/C -->
  <rect x="8" y="482" width="344" height="150" rx="8" fill="#2D2D2D"/>
  <text x="24" y="512" font-family="sans-serif" font-size="15" fill="#B0B0B0">Trip Meters</text>
  <rect x="108" y="492" width="88" height="28" rx="4" fill="#242424" stroke="#3D3D3D"/>
  <text x="120" y="511" font-family="sans-serif" font-size="14" fill="#FFFFFF">Trip A</text>
  <path d="M 178 501 L 186 501 L 182 508 Z" fill="#B0B0B0"/>
  <text x="212" y="511" font-family="sans-serif" font-size="12" font-weight="600" letter-spacing="1" fill="#2196F3">RESET</text>
  <text x="262" y="511" font-family="sans-serif" font-size="12" font-weight="600" letter-spacing="1" fill="#2196F3">CLEAR ALL</text>
  <g font-family="sans-serif" text-anchor="middle">
    <text x="65"  y="552" font-size="15" fill="#B0B0B0">Trip A</text>
    <text x="65"  y="588" font-size="26" fill="#FFFFFF">15.2</text>
    <text x="65"  y="608" font-size="12" fill="#B0B0B0">km</text>
    <text x="180" y="552" font-size="15" fill="#B0B0B0">Trip B</text>
    <text x="180" y="588" font-size="26" fill="#FFFFFF">127.8</text>
    <text x="180" y="608" font-size="12" fill="#B0B0B0">km</text>
    <text x="295" y="552" font-size="15" fill="#B0B0B0">Trip C</text>
    <text x="295" y="588" font-size="26" fill="#FFFFFF">1450.3</text>
    <text x="295" y="608" font-size="12" fill="#B0B0B0">km</text>
  </g>

  </g>
  </g>
</svg>
