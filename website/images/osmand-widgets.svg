<svg xmlns="http://www.w3.org/2000/svg" width="360" height="780" viewBox="0 0 360 760">
  <!-- Interface mockup: OsmAnd map widgets, natural OsmAnd-style light map,
       plugin widgets on left/right map panels showing the real value formats
       ("85% 84.2V", "Trip A 15.2 km", ...) -->
  <rect width="360" height="760" fill="#F4F1EA"/>

  <!-- OsmAnd top bar (Configure screen menu row) -->
  <rect width="360" height="52" fill="#4C7D4C"/>
  <path d="M 14 20 L 26 20 M 16 25 L 26 25 M 18 30 L 26 30" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
  <text x="34" y="32" font-family="sans-serif" font-size="15" font-weight="600" fill="#FFFFFF">Configure screen</text>
  <path d="M 334 20 L 346 26 L 334 32 Z" fill="#FFFFFF"/>

  <!-- Map -->
  <g stroke="#D8D2C4" stroke-width="7" fill="none" stroke-linecap="round">
    <path d="M 20 700 C 90 640 60 560 40 480" />
    <path d="M 330 660 C 280 620 300 540 320 500"/>
  </g>
  <g stroke="#FFFFFF" stroke-width="12" fill="none" stroke-linecap="round">
    <path d="M 0 400 L 170 420 L 360 380" stroke-width="14"/>
    <path d="M 120 760 L 150 420" stroke-width="10"/>
    <path d="M 240 760 L 220 380" stroke-width="10"/>
  </g>
  <g stroke="#F0C24B" stroke-width="10" fill="none" stroke-linecap="round">
    <path d="M 0 400 L 170 420 L 360 380"/>
  </g>
  <g stroke="#E8E3D8" stroke-width="6" fill="none" stroke-linecap="round">
    <path d="M 0 300 L 360 260"/>
    <path d="M 0 520 L 360 560"/>
    <path d="M 60 760 L 90 120"/>
  </g>
  <!-- park / water blobs -->
  <circle cx="80" cy="180" r="34" fill="#C8E6C9"/>
  <circle cx="290" cy="640" r="42" fill="#C8E6C9"/>
  <path d="M 0 690 Q 90 670 160 700 T 360 690 L 360 760 L 0 760 Z" fill="#A5D0F3"/>

  <!-- Left panel widget chips (plugin widgets) -->
  <g font-family="sans-serif" font-size="14">
    <rect x="8"  y="60" width="118" height="30" rx="6" fill="#CC000000"/>
    <text x="18" y="80" fill="#FFFFFF">&#128267; 85% 84.2V</text>
    <rect x="8"  y="94" width="86"  height="30" rx="6" fill="#CC000000"/>
    <text x="18" y="114" fill="#FFFFFF">&#128267; 85%</text>
    <rect x="8"  y="128" width="92" height="30" rx="6" fill="#CC000000"/>
    <text x="18" y="148" fill="#FFFFFF">&#9889; 84.2V</text>
    <rect x="8"  y="162" width="120" height="30" rx="6" fill="#CC000000"/>
    <text x="18" y="182" fill="#FFFFFF">&#128666; Trip A 15.2 km</text>
  </g>

  <!-- Right panel widget chips -->
  <g font-family="sans-serif" font-size="14">
    <rect x="232" y="60"  width="120" height="30" rx="6" fill="#CC000000"/>
    <text x="242" y="80"  fill="#FFFFFF">&#128666; Trip B 127.8</text>
    <rect x="236" y="94"  width="116" height="30" rx="6" fill="#CC000000"/>
    <text x="246" y="114" fill="#FFFFFF">&#128666; Trip C 1450.3</text>
  </g>

  <!-- Current position + OsmAnd map pin -->
  <circle cx="185" cy="470" r="12" fill="#4C7D4C" stroke="#FFFFFF" stroke-width="3"/>
  <path d="M 185 500 C 165 500 152 514 152 532 C 152 560 185 588 185 588 C 185 588 218 560 218 532 C 218 514 205 500 185 500 Z" fill="#DA4648"/>
  <circle cx="185" cy="534" r="14" fill="#FFFFFF"/>
  <text x="185" y="540" font-family="sans-serif" font-size="16" font-weight="800" fill="#DA4648" text-anchor="middle">4.2</text>
  <text x="185" y="622" font-family="sans-serif" font-size="12" fill="#6B6B6B" text-anchor="middle">4.2 km to destination</text>

  <!-- zoom controls -->
  <rect x="310" y="560" width="32" height="64" rx="8" fill="#FFFFFF" stroke="#D8D2C4"/>
  <text x="326" y="586" font-family="sans-serif" font-size="18" fill="#6B6B6B" text-anchor="middle">+</text>
  <text x="326" y="614" font-family="sans-serif" font-size="18" fill="#6B6B6B" text-anchor="middle">&#8722;</text>

  <text x="180" y="742" font-family="sans-serif" font-size="13" fill="#6B6B6B" text-anchor="middle">Plugin widgets live on OsmAnd's left / right map panels</text>
</svg>
